<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sports Training Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sporty: {
                            neon: '#39ff14', // Sporty neon green accent
                            dark: '#111827', // Dark background
                            panel: '#1f2937' // Panel background
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS to ensure the HTML tables returned by Gemini look clean */
        #result-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }
        #result-content th, #result-content td {
            border: 1px solid #374151;
            padding: 0.75rem;
            text-align: left;
        }
        #result-content th {
            background-color: #374151;
            color: #39ff14;
        }
        #result-content ul {
            list-style-type: disc;
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }
        #result-content h2, #result-content h3 {
            color: #39ff14;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body class="bg-sporty-dark text-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sporty-neon to-green-500 uppercase tracking-wider">
                Pro AI Training Planner
            </h1>
            <p class="text-gray-400 mt-2">Generate customized sports training programs instantly.</p>
        </header>

        <!-- Main Form Panel -->
        <div class="bg-sporty-panel p-8 rounded-xl shadow-2xl border border-gray-700">
            <form id="planner-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Sport Type</label>
                    <input type="text" id="sport" placeholder="e.g., Soccer, Basketball" required
                        class="w-full bg-gray-900 border border-gray-600 text-white rounded-lg p-3 focus:outline-none focus:border-sporty-neon transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Target Audience</label>
                    <select id="audience" required class="w-full bg-gray-900 border border-gray-600 text-white rounded-lg p-3 focus:outline-none focus:border-sporty-neon transition">
                        <option value="" disabled selected>Select an audience</option>
                        <option value="Kids (U8-U12)">Kids (U8-U12)</option>
                        <option value="Teens (High School)">Teens (High School)</option>
                        <option value="Adults (Amateur)">Adults (Amateur)</option>
                        <option value="Professional Athletes">Professional Athletes</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Duration</label>
                    <select id="duration" required class="w-full bg-gray-900 border border-gray-600 text-white rounded-lg p-3 focus:outline-none focus:border-sporty-neon transition">
                        <option value="" disabled selected>Select duration</option>
                        <option value="4 weeks">4 weeks</option>
                        <option value="8 weeks">8 weeks</option>
                        <option value="12 weeks">12 weeks</option>
                        <option value="Full Season (6 months)">Full Season (6 months)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Main Goal</label>
                    <input type="text" id="goal" placeholder="e.g., Fundamental skills, Conditioning" required
                        class="w-full bg-gray-900 border border-gray-600 text-white rounded-lg p-3 focus:outline-none focus:border-sporty-neon transition">
                </div>

                <div class="md:col-span-2 mt-4">
                    <button type="submit" 
                        class="w-full bg-sporty-neon text-black font-bold text-lg py-3 rounded-lg hover:bg-green-400 transition shadow-[0_0_15px_rgba(57,255,20,0.5)]">
                        Generate Training Plan
                    </button>
                </div>
            </form>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden flex flex-col items-center justify-center mt-12">
            <svg class="animate-spin h-10 w-10 text-sporty-neon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-4 text-sporty-neon font-semibold animate-pulse">Designing your playbook...</p>
        </div>

        <!-- Results Container -->
        <div id="result-container" class="hidden mt-10 bg-sporty-panel p-8 rounded-xl shadow-2xl border border-gray-700">
            <h2 class="text-2xl font-bold border-b border-gray-600 pb-3 mb-6 text-white flex items-center">
                <span class="mr-2">📋</span> Your Custom Plan
            </h2>
            <div id="result-content" class="text-gray-200 leading-relaxed">
                <!-- AI Output will be injected here -->
            </div>
        </div>

    </div>

    <script>
        // ⚠️ WARNING: DO NOT USE THIS EXPOSED KEY. REGENERATE A NEW ONE IN GOOGLE CLOUD.
        // Client-side API keys are insecure. Use a backend server for production apps.
        const API_KEY = "AIzaSyAoAtSiz0Fvg-CXjSCRh-4XC8vKspDQkac";
        
document.getElementById('planner-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    // 입력값 가져오기
    const sport = document.getElementById('sport').value;
    const audience = document.getElementById('audience').value;
    const duration = document.getElementById('duration').value;
    const goal = document.getElementById('goal').value;

    // UI 요소
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('result-container');
    const resultContent = document.getElementById('result-content');

    // UI 초기화
    resultContainer.classList.add('hidden');
    loading.classList.remove('hidden');

    const promptText = `
        You are an expert sports coach. Create a highly detailed training plan based on the following:
        - Sport: ${sport}
        - Target Audience: ${audience}
        - Duration: ${duration}
        - Main Goal: ${goal}
        
        Format the ENTIRE response in valid HTML. 
        Do not include markdown tags like \`\`\`html. Just return the raw HTML elements.
        Requirements:
        - Use <h2> and <h3> for headings.
        - Use a clean HTML <table> for the season/macro plan overview.
        - Use HTML unordered lists <ul> and <li> for specific lesson/session plans.
        - Keep the tone motivating and professional.
    `;

    try {
        // 💡 수정된 부분: gemini-2.5-flash (또는 gemini-2.0-flash)로 변경
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: promptText }]
                }]
            })
        });

        if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        
        let aiHtml = data.candidates[0].content.parts[0].text;
        aiHtml = aiHtml.replace(/```html/g, '').replace(/```/g, '');

        resultContent.innerHTML = aiHtml;
        
    } catch (error) {
        console.error("Error generating plan:", error);
        resultContent.innerHTML = `<p class="text-red-400 font-bold">Failed to generate plan. Please check your API key and connection. (${error.message})</p>`;
    } finally {
        loading.classList.add('hidden');
        resultContainer.classList.remove('hidden');
    }
});

    </script>
</body>
</html>
